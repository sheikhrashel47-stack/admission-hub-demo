name: Auth Endpoints Guard
on:
  push:
    branches: [main]
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run AUTH endpoints guard
        run: node AUTH_ENDPOINTS_GUARD.test.mjs
