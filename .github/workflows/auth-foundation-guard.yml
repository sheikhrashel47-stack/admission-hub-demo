name: Auth Foundation Guard
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'auth/**'
      - 'auth-foundation.test.mjs'
      - 'auth-foundation-chaos.test.mjs'
      - 'auth-protection.test.mjs'
      - '.github/workflows/auth-foundation-guard.yml'
      - '.github/CODEOWNERS'
      - 'docs/AUTH-*'
      - 'docs/EMAIL-GATEWAY-*'
      - 'package.json'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Auth architecture, recovery, chaos and protection contracts
        run: npm run test:auth
