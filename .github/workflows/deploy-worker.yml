name: Deploy Admission Hub Worker

on:
  push:
    branches:
      - main
    paths:
      - 'gk-agent-worker.js'
      - 'public-worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          preCommands: |
            # Set secrets if they don't exist
            wrangler secret put RESEND_KEY <<< "${{ secrets.RESEND_KEY }}" || true
            wrangler secret put ADMIN_TOKEN <<< "${{ secrets.ADMIN_TOKEN }}" || true
            wrangler secret put GOOGLE_CLIENT_ID <<< "${{ secrets.GOOGLE_CLIENT_ID }}" || true
            wrangler secret put GOOGLE_CLIENT_SECRET <<< "${{ secrets.GOOGLE_CLIENT_SECRET }}" || true
      
      - name: Verify Deployment
        run: |
          curl -f https://admission-gk.rashelzayan213.workers.dev/api/health || exit 1
          echo "✅ Worker deployed successfully!"
