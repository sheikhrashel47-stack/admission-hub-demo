name: Native Auth Mailjet Delivery No-Send Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_MAILJET_DELIVERY to read recent aggregate delivery states without sending
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirmation == 'AUDIT_MAILJET_DELIVERY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Fetch provider credentials from Infisical using OIDC
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          recursive: false
          include-imports: false
          export-type: env
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}

      - name: Read aggregate recent Mailjet delivery states
        run: node auth-native/operations/audit-mailjet-recent-delivery.mjs
