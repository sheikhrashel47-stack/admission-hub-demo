name: Email Gateway Provider Account No-Send Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_PROVIDER_ACCOUNTS to run read-only credential and sender/domain checks without sending
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: admission-hub-email-gateway-production
  cancel-in-progress: false

jobs:
  audit-provider-accounts:
    if: ${{ inputs.confirmation == 'AUDIT_PROVIDER_ACCOUNTS' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: email-gateway-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify non-secret Infisical connection metadata
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
          INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
        run: |
          set -eu
          test -n "$INFISICAL_IDENTITY_ID"
          test -n "$INFISICAL_PROJECT_SLUG"
          test "$INFISICAL_ENV_SLUG" = "prod"
          test "$INFISICAL_SECRET_PATH" = "/email-gateway"

      - name: Fetch provider credentials from Infisical using OIDC
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          recursive: false
          include-imports: false
          export-type: env
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}

      - name: Run bounded read-only provider account audit
        env:
          PROVIDER_ACCOUNT_REQUIRE_MAILJET_READY: 'true'
        run: node email-gateway/operations/audit-provider-accounts.mjs
