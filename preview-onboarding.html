<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onboarding Preview — Admission Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./onboarding.css?v=preview-v4">
<style>
  html,body{margin:0;height:100%;background:#EDEDEA;}
  body{display:flex;flex-direction:column;align-items:center;}
  #devbar{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:9999;
    display:flex;align-items:center;gap:8px;background:#171717;color:#fff;
    border-radius:99px;padding:6px 8px 6px 14px;font:600 12px/1 'Noto Sans Bengali',sans-serif;
    box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:.92;
  }
  #devbar b{color:#7CE0A9;margin-right:2px;}
  #devbar button{
    border:none;border-radius:99px;background:#087A45;color:#fff;cursor:pointer;
    font:600 12px/1 'Noto Sans Bengali',sans-serif;padding:8px 12px;
  }
  #devbar button:active{background:#075B3A;}
  #ahSplash{position:fixed!important;}
</style>
</head>
<body>
<div id="ahOnboardGate" aria-label="Onboarding" style="display:none"></div>
<div id="devbar"><b>PREVIEW</b> <span id="devStep">Screen 1/10</span> <button id="devReset" type="button">রিসেট</button></div>
<script src="./onboarding.js?v=preview-v4"></script>
<script>
  (function(){
    try{
      localStorage.setItem('ahPubToken','preview-token');
      localStorage.setItem('ahPubUser', JSON.stringify({uid:'preview-user', name:'Rashed'}));
    }catch(e){}
    // fake app router so finish() lands on a visible message
    window.navigate = function(path){
      var m = document.createElement('div');
      m.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#FCFBF8;color:#171717;'+
        'display:grid;place-content:center;text-align:center;gap:10px;'+
        'font:600 16px/1.5 "Noto Sans Bengali",sans-serif;';
      m.innerHTML = '<div style="font-size:44px">🎓</div>FINISH → নেভিগেট: <b>'+path+'</b>'+
        '<div style="font-size:12px;color:#777">(আসল অ্যাপে এখানে ড্যাশবোর্ড আসবে)</div>'+
        '<button onclick="location.reload()" style="margin-top:8px;border:none;border-radius:99px;'+
        'background:#087A45;color:#fff;font:600 14px/1 "Noto Sans Bengali",sans-serif;padding:12px 22px;cursor:pointer">আবার শুরু করি</button>';
      document.body.appendChild(m);
    };
    function refresh(){
      try{ localStorage.removeItem('ahOnboard:preview-user'); }catch(e){}
      if (window.AHOnboard && typeof AHOnboard.start === 'function'){
        AHOnboard.start().then(function(on){
          if (on){ document.getElementById('devbar').style.display='flex'; }
        });
      }
    }
    document.getElementById('devReset').onclick = function(){ refresh(); };
    refresh();
  })();
</script>
</body>
</html>
