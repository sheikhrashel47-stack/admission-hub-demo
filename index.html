<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admission Hub — ভর্তি প্রস্তুতি অ্যাপ (প্র্যাকটিস · মক পরীক্ষা · AI টিউটর)</title>
<meta name="description" content="বাংলাদেশের ভর্তি-প্রস্তুতির ফ্রি অ্যাপ — প্রশ্নব্যাংক প্র্যাকটিস, টাইমড মক পরীক্ষা, শব্দভাণ্ডার, ভুল-রিভিউ আর বাংলা AI টিউটর। সম্পূর্ণ ফ্রি।">
<meta property="og:title" content="Admission Hub — ভর্তি প্রস্তুতি অ্যাপ">
<meta property="og:description" content="প্রশ্নব্যাংক প্র্যাকটিস · মক পরীক্ষা · শব্দভাণ্ডার · AI টিউটর — একদম ফ্রি">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0e7a58">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--em:#0e7a58;--em-d:#0f6b4f;--bg:#f4faf7;--card:#fff;--line:#e3ede7;--ink:#1d2e26;--mut:#5f7a6e;--soft:#e9f5ef;--warn:#b3541e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI','Noto Sans Bengali','Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;padding:12px 14px;background:rgba(244,250,247,.9);backdrop-filter:blur(8px)}
.hdr .brand{font-weight:800;font-size:16px;color:var(--em-d);flex:1;display:flex;align-items:center;gap:7px}
.hdr .brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#12a06f,#0e7a58);color:#fff;display:grid;place-items:center;font-size:13px}
.hdr .pill{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--warn);font-weight:700}
.hdr .aibtn{background:var(--em);color:#fff;border:0;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;cursor:pointer;border-radius:12px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--em-d);font-weight:800;background:var(--soft)}
main{max-width:560px;margin:0 auto;padding:12px 13px 92px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 6px rgba(16,40,30,.05);animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:15.5px;margin:14px 2px 4px}
.mut{color:var(--mut);font-size:12px}
.goal{background:linear-gradient(135deg,#0f7a57,#0b5f45);color:#fff;border:0}
.goal .big{font-size:16px;font-weight:800}
.goal .go{background:#fff;color:var(--em-d);border:0;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;margin-top:10px}
.bar{height:7px;background:#e8f0ec;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#12a06f,#0e7a58);border-radius:6px;transition:width .6s ease}
.chip{display:inline-block;background:var(--soft);color:var(--em-d);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;margin:4px 4px 0 0;cursor:pointer;border:1px solid transparent}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--em);background:#e7f5ee}
.opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:14px;cursor:pointer;color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--em-d);flex:none}
.opt.sel{border-color:var(--em);background:#f2faf6}
.opt.right{border-color:#12a06f;background:#eefaf4}
.opt.wrong{border-color:#d05656;background:#fdf3f2}
.opt .mark{margin-left:auto;font-weight:800}
.btn{background:var(--em);color:#fff;border:0;border-radius:11px;padding:11px 18px;font-weight:800;font-size:13.5px;cursor:pointer}
.btn.sec{background:#fff;color:var(--em-d);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--warn);background:#fdf1e7;border-radius:999px;padding:6px 12px;font-size:13px;display:inline-block}
.ring{display:block;margin:6px auto}
.exq{font-size:15px;font-weight:700;line-height:1.55;margin:8px 0}
.explain{background:var(--soft);border-radius:12px;padding:11px;font-size:13px;line-height:1.6;margin-top:8px}
.rec{background:#fff8ec;border:1px solid #f2e3c4;border-radius:12px;padding:11px;font-size:13px;margin-top:10px}
.at{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px dashed var(--line);font-size:13px}
.at b{flex:1}
input[type=text],input[type=password],input[type=tel],textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.demo-note{font-size:11px;color:var(--mut);text-align:center;margin:14px 0 4px}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:rise .2s ease}
.sheet .shead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}
.sheet .shead b{flex:1}
.sheet .sbody{flex:1;overflow-y:auto;padding:14px 14px 90px;max-width:560px;margin:0 auto;width:100%}
.row{display:flex;gap:8px;align-items:center}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.mb{max-width:86%;padding:10px 13px;border-radius:15px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.mb.me{align-self:flex-end;background:var(--em);color:#fff;border-bottom-right-radius:5px}
.mb.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.comp{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px}
.comp input{flex:1}
.aiexp{background:#f2faf6;border:1px solid #d7ece2;border-radius:12px;padding:10px;font-size:12.5px;line-height:1.6;margin:8px 0 0}
.trend{display:flex;align-items:flex-end;gap:6px;height:64px;padding:6px 2px}
.trend i{flex:1;background:linear-gradient(180deg,#22b57f,#0e7a58);border-radius:6px 6px 2px 2px;min-height:6px;position:relative}
.trend i span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--mut)}
.pal{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.pal button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--mut)}
.pal button.done{background:var(--soft);color:var(--em-d);border-color:#bfe3d2}
.pal button.cur{border-color:var(--em);color:var(--em-d)}
.streak3d{background:linear-gradient(135deg,#fff,#f0faf5 55%,#dff2e8);border:1px solid #cfe8db;border-radius:18px;padding:14px;box-shadow:0 10px 22px rgba(14,122,88,.14),inset 0 1px 0 #fff;position:relative;overflow:hidden}
.streak3d .flame{font-size:34px;filter:drop-shadow(0 6px 8px rgba(179,84,30,.35));animation:flick 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
.vrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px dashed var(--line)}
.vrow .w{font-weight:800;font-size:14px}
.vrow .m{flex:1;font-size:12.5px;color:var(--mut)}
.lr{background:var(--soft);color:var(--em-d);border:0;border-radius:9px;padding:6px 10px;font-weight:800;font-size:11.5px;cursor:pointer}
.lr.done{background:#dff2e8}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.login .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#12a06f,#0e7a58);display:grid;place-items:center;font-size:32px;margin:0 auto 10px;box-shadow:0 12px 26px rgba(14,122,88,.25)}
.otp{display:flex;gap:7px;justify-content:center;margin:12px 0}
.otp input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:800}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#12291f;color:#fff;border-radius:12px;padding:10px 16px;font-size:12.5px;z-index:90;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:rise .25s ease;max-width:88vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const API = 'https://admission-gk.rashelzayan213.workers.dev/pub';
const LS = { get(k, d){ try { const v = localStorage.getItem('ahd:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v){ try { localStorage.setItem('ahd:' + k, JSON.stringify(v)); } catch (e) {} }, del(k){ try { localStorage.removeItem('ahd:' + k); } catch (e) {} } };
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const dateBn = ts => { try { return new Date(ts).toLocaleDateString('bn-BD', { day: 'numeric', month: 'long' }); } catch (e) { return ''; } };
const timeGreet = () => { const h = new Date().getHours(); return h < 5 ? 'শুভ রাত' : h < 12 ? 'শুভ সকাল' : h < 16 ? 'শুভ দুপুর' : h < 19 ? 'শুভ বিকাল' : 'শুভ সন্ধ্যা'; };
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const CONTENT_FALLBACK = { v: 0, questions: [], vocabulary: [], exams: [] };

const S = {
  token: LS.get('tok', ''), user: LS.get('user', null),
  content: LS.get('content', CONTENT_FALLBACK),
  st: LS.get('st', { attempts: [], mistakes: [], vocab: [], learned: {}, streak: { n: 0, last: '' }, chat: [] }),
  tab: 'home', session: null, exam: null, otpId: '', otpSent: false, busy: false, dirty: false, syncing: false, lastSync: LS.get('lastSync', 0)
};
const saveSt = () => { LS.set('st', S.st); S.dirty = true; };

/* ── সিঙ্ক (লাইফটাইম-ক্লাউড-সেভ) ── */
const syncNow = async silent => {
  if (!S.token || S.syncing) return;
  S.syncing = true; try { paintTop(); } catch (e) {}
  try {
    const r = await fetch(API + '/state', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token }, body: JSON.stringify(S.st) });
    if (r.status === 401 || r.status === 403) { logout(true); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S.dirty = false; S.lastSync = Date.now(); LS.set('lastSync', S.lastSync);
    if (!silent && window.__toast) window.__toast('☁️ তোমার ডেটা ক্লাউডে সেভ হয়েছে ✓');
  } catch (e) { if (!silent && window.__toast) window.__toast('⚠️ সিঙ্ক হয়নি — ইন্টারনেট দেখো'); }
  S.syncing = false; try { paintTop(); } catch (e) {}
};
let syncT = null;
const queueSync = () => { clearTimeout(syncT); syncT = setTimeout(() => syncNow(true), 2500); };
setInterval(() => { if (S.dirty && S.token) syncNow(true); }, 90000);
document.addEventListener('visibilitychange', () => { if (document.hidden && S.dirty && S.token) syncNow(true); });

/* ── কন্টেন্ট অটো-আপডেট (admin publish → সাথে সাথে) ── */
const pullContent = async silent => {
  try {
    const r = await fetch(API + '/content');
    const c = await r.json();
    if (c && (c.v || 0) > (S.content.v || 0)) {
      S.content = c; LS.set('content', c);
      if (!silent && window.__toast) window.__toast('📚 নতুন কন্টেন্ট এসেছে — v' + bn(c.v) + ' (' + bn((c.questions || []).length) + ' প্রশ্ন)');
      try { render(); } catch (e) {}
    }
  } catch (e) {}
};
setInterval(() => { if (S.token && !document.hidden) pullContent(true); }, 60000);

/* ── টোস্ট ── */
const toast = m => { try { const o = document.querySelector('.toast'); if (o) o.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); } catch (e) {} };
window.__toast = toast;

/* ── বুট ── */
const app = () => document.getElementById('app');
const boot = async () => {
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) {}
  if (!S.token) { renderLogin(); return; }
  if (!S.user) { try { S.user = LS.get('user', { name: 'শিক্ষার্থী' }); } catch (e) {} }
  const t = today();
  if (S.st.streak.last !== t) { const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10); S.st.streak = { n: S.st.streak.last === y ? S.st.streak.n + 1 : 1, last: t }; saveSt(); }
  render(); pullContent(true);
  try { const r = await fetch(API + '/state', { headers: { Authorization: 'Bearer ' + S.token } }); if (r.status === 401 || r.status === 403) return logout(true); const st = await r.json(); if (st && (st.attempts || []).length >= (S.st.attempts || []).length) { S.st = Object.assign({ attempts: [], mistakes: [], vocab: [], learned: {}, streak: S.st.streak, chat: [] }, st); LS.set('st', S.st); render(); } } catch (e) {}
};

/* ── লগইন ── */
const renderLogin = () => {
  app().innerHTML = '<div class="login"><div class="logo">🎓</div><div style="text-align:center"><b style="font-size:20px">Admission Hub</b><div class="mut" style="margin-top:3px">ভর্তি প্রস্তুতি — প্র্যাকটিস · পরীক্ষা · AI টিউটর<br>সব ফ্রি · তোমার ডেটা আজীবন সেভ</div></div>'
  + '<div class="card" style="margin-top:16px"><div class="mut">নাম বা মোবাইল বা জিমেইল দিয়ে ঢোকো</div><input type="text" id="lid" placeholder="যেমন: রাশেল / 01XXXXXXXXX / তোমার@gmail.com" style="margin-top:6px"><input type="text" id="lnm" placeholder="তোমার নাম (নতুন হলে)" style="margin-top:8px" maxlength="30">'
  + (S.otpSent ? '<div class="mut" style="margin-top:10px">📩 ৬-সংখ্যার কোড দাও (ডেমো-মোড: কোড নিচে)</div><div class="otp">' + [0,1,2,3,4,5].map(i => '<input type="tel" maxlength="1" id="o' + i + '">').join('') + '</div>'
      + (S.otpDemo ? '<div class="rec" style="margin:0 0 8px">ডেমো-কোড: <b style="font-size:16px;letter-spacing:3px">' + esc(S.otpDemo) + '</b></div>' : '')
      + '<button class="btn" style="width:100%" onclick="AHD.verify()">✅ যাচাই করে ঢোকো</button><button class="btn sec" style="width:100%;margin-top:8px" onclick="AHD.backLogin()">← অন্য নাম্বার/মেইল</button>'
    : '<button class="btn" style="width:100%;margin-top:10px" onclick="AHD.sendOtp()">OTP পাঠাও →</button>'
      + '<button class="btn sec" style="width:100%;margin-top:8px" onclick="AHD.googleSoon()">🔵 Google দিয়ে লগইন (শীঘ্রই)</button><div class="mut" style="margin-top:8px">লগইন করলেই তোমার অগ্রগতি ক্লাউডে আজীবন সেভ হবে</div>')
  + '</div><div class="demo-note">সম্পূর্ণ ফ্রি · কোনো key লাগবে না — AI অ্যাপের নিজস্ব ইঞ্জিনে চলে</div></div>';
};
const sendOtp = async () => {
  const v = (document.getElementById('lid').value || '').trim();
  if (v.length < 3) { toast('নাম/মোবাইল/জিমেইল লেখো'); return; }
  S.otpId = v; toast('কোড পাঠানো হচ্ছে…');
  try { const r = await fetch(API + '/auth/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: v }) }); const d = await r.json(); if (!r.ok) { toast(d.error || 'হয়নি'); return; } S.otpSent = true; S.otpDemo = d.code || ''; renderLogin(); if (S.otpDemo) { const o0 = document.getElementById('o0'); if (o0) o0.focus(); } } catch (e) { toast('ইন্টারনেট দেখো'); }
};
const backLogin = () => { S.otpSent = false; S.otpDemo = ''; renderLogin(); };
const verify = async () => {
  const code = [0,1,2,3,4,5].map(i => (document.getElementById('o' + i) || {}).value || '').join('');
  if (code.length !== 6) { toast('৬-সংখ্যার কোড দাও'); return; }
  try {
    const r = await fetch(API + '/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: S.otpId, code, name: (document.getElementById('lnm') || {}).value || '' }) });
    const d = await r.json(); if (!r.ok) { toast(d.error || 'কোড ভুল'); return; }
    S.token = d.token; S.user = d.user; LS.set('tok', d.token); LS.set('user', d.user);
    S.otpSent = false; S.otpDemo = '';
    toast('স্বাগতম, ' + d.user.name + '! 🎉'); boot();
  } catch (e) { toast('ইন্টারনেট দেখো'); }
};
const googleSoon = () => toast('Google-লগইন শীঘ্রই — আপাতত জিমেইল+OTP ব্যবহার করো');
const logout = silent => { LS.del('tok'); LS.del('user'); S.token = ''; S.user = null; if (!silent) toast('লগআউট হয়েছে'); renderLogin(); };

/* ── শেল ── */
const hdr = () => '<div class="hdr"><div class="brand"><span class="logo">🎓</span> Admission Hub</div>'
  + (S.syncing ? '<span class="pill">☁️ সিঙ্ক হচ্ছে…</span>' : '<span class="pill">🔥 ' + bn(S.st.streak.n) + '</span>')
  + '<button class="aibtn" onclick="AHD.go(\'ai\')">🤖 AI</button></div>';
const nav = () => { const t = [['home','🏠','হোম'],['practice','📚','প্র্যাকটিস'],['exams','📝','পরীক্ষা'],['vocab','📖','শব্দ'],['profile','👤','প্রোফাইল']]; return '<nav class="nav">' + t.map(([id, ic, lb]) => '<button class="' + (S.tab === id ? 'on' : '') + '" onclick="AHD.go(\'' + id + '\')"><span class="ic">' + ic + '</span>' + lb + '</button>').join('') + '</nav>'; };
const render = () => {
  if (!S.token) { renderLogin(); return; }
  const v = { home: vHome, practice: vPractice, exams: vExams, vocab: vVocab, profile: vProfile }[S.tab] || vHome;
  if (S.tab === 'ai') { openAI(); return; }
  app().innerHTML = hdr() + '<main id="view">' + v() + '</main><div class="demo-note">Admission Hub · কন্টেন্ট v' + bn(S.content.v || 0) + ' · ' + bn((S.content.questions || []).length) + ' প্রশ্ন · ' + bn((S.content.vocabulary || []).length) + ' শব্দ</div>' + nav();
};

  const z = S.quiz; if (!z) return;
  if (oi === z.items[z.i].a) z.score++;
  z.i++;
  if (z.i >= z.items.length) { toast('কুইজ শেষ: ' + bn(z.score) + '/' + bn(z.items.length) + (z.score >= 4 ? ' 🎉' : ' 💪')); S.quiz = null; render(); return; }
  renderQuiz();
};

/* ── AI (server-side — কোনো key লাগে না) ── */
const aiCall = async prompt => {
  if (!S.token) throw new Error('আগে লগইন করো');
  const msgs = (S.st.chat || []).slice(-6).map(m => ({ role: m.w === 'me' ? 'user' : 'assistant', content: m.t }));
  msgs.push({ role: 'user', content: prompt });
  const r = await fetch(API + '/ai', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token }, body: JSON.stringify({ messages: msgs }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return String(d.text || '').trim();
};
const explainQ = async () => {
  const ss = S.session, el = document.getElementById('aiexp'); if (!ss || !el) return;

  catch (e) { el.innerHTML = '<div class="aiexp">⚠️ ' + esc(String(e.message || e)) + '</div>'; }
};

  document.body.appendChild(sh);
};
const closeAI = () => { const s = document.getElementById('aisheet'); if (s) s.remove(); S.tab = 'home'; render(); };
const chatSend = async () => {
  const inp = document.getElementById('cin'), t = (inp.value || '').trim(); if (!t || S.busy) return;
  S.st.chat = (S.st.chat || []).concat([{ w: 'me', t }]); inp.value = '';
  const box = document.getElementById('cmsgs'); box.insertAdjacentHTML('beforeend', '<div class="mb me">' + esc(t) + '</div><div class="mb ai" id="think">🤖 ভাবছি…</div>'); box.scrollTop = box.scrollHeight;
  S.busy = true;
  try { const a = await aiCall(t); S.st.chat = (S.st.chat || []).concat([{ w: 'ai', t: a }]).slice(-80); saveSt(); const th = document.getElementById('think'); if (th) th.outerHTML = '<div class="mb ai">' + esc(a) + '</div>'; }
  catch (e) { const th = document.getElementById('think'); if (th) th.textContent = '⚠️ ' + String(e.message || e); }
  S.busy = false; const b = document.getElementById('cmsgs'); if (b) b.scrollTop = b.scrollHeight;
};
